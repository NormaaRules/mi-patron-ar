<script>

  const video = document.querySelector("#video");
  const mensaje = document.querySelector("#mensaje");

  const target = document.querySelector(
    '[mindar-image-target="targetIndex: 0"]'
  );

  // Mostrar errores del vídeo
  video.addEventListener("error", function () {
    mensaje.innerHTML =
      "ERROR DEL VÍDEO: " +
      (video.error ? video.error.message : "Error desconocido");

    console.log("Error del vídeo:", video.error);
  });

  // Cuando el vídeo esté listo
  video.addEventListener("canplay", function () {
    console.log("Vídeo listo para reproducirse");
  });

  // Cuando encuentra el patrón
  target.addEventListener("targetFound", async function () {

    mensaje.innerHTML = "¡Patrón reconocido!";

    video.muted = true;
    video.loop = true;
    video.playsInline = true;

    try {

      await video.play();

      mensaje.innerHTML = "¡Vídeo reproduciéndose!";

      console.log("Vídeo reproduciéndose correctamente");

    } catch (error) {

      console.error("ERROR AL REPRODUCIR:", error);

      mensaje.innerHTML =
        "ERROR AL REPRODUCIR:<br>" +
        error.name +
        "<br>" +
        error.message;

    }

  });

  // Cuando pierde el patrón
  target.addEventListener("targetLost", function () {

    mensaje.innerHTML = "Apunta la cámara hacia el patrón";

    video.pause();

  });

</script>
