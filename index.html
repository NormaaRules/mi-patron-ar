<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #mensaje {
      position: fixed;
      z-index: 10;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-family: Arial;
      text-align: center;
    }

    #boton {
      display: none;
      position: fixed;
      z-index: 20;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: white;
    }
  </style>
</head>

<body>

<div id="mensaje">
  Apunta la cámara hacia el patrón
</div>

<button id="boton">▶ REPRODUCIR VÍDEO</button>

<a-scene
  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: true;
    uiScanning: yes;
    uiLoading: yes;
  "
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <video
      id="video"
      src="./video.mp4"
      preload="auto"
      loop
      crossorigin="anonymous"
      playsinline>
    </video>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <a-video
      id="videoAR"
      src="#video"
      position="0 0 0"
      width="1"
      height="0.5625"
      rotation="0 0 0">
    </a-video>

  </a-entity>

</a-scene>

<script>

const video = document.querySelector("#video");
const boton = document.querySelector("#boton");
const mensaje = document.querySelector("#mensaje");

const target = document.querySelector(
  '[mindar-image-target="targetIndex: 0"]'
);

target.addEventListener("targetFound", () => {

  mensaje.innerHTML = "¡Patrón reconocido!";

  boton.style.display = "block";

  video.muted = true;

  video.play().catch(() => {
    console.log("El navegador requiere pulsar el botón.");
  });

});

target.addEventListener("targetLost", () => {

  mensaje.innerHTML = "Apunta la cámara hacia el patrón";

  boton.style.display = "none";

  video.pause();

});

boton.addEventListener("click", () => {

  video.muted = false;

  video.play();

  boton.style.display = "none";

});

</script>

</body>
</html>
