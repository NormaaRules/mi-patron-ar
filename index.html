<script>
  // ================================
  // ELEMENTOS
  // ================================
  const videoElement = document.querySelector("#video");
  const messageElement = document.querySelector("#mensaje");
  const arTargetElement = document.querySelector(
    '[mindar-image-target="targetIndex: 0"]'
  );

  // ================================
  // COMPROBACIONES
  // ================================
  if (!videoElement) {
    console.error("No se encontró #video.");
    if (messageElement) {
      messageElement.textContent = "Error: no se encontró el vídeo.";
    }
    throw new Error("Elemento #video no encontrado.");
  }

  if (!arTargetElement) {
    console.error("No se encontró el target de MindAR.");
    if (messageElement) {
      messageElement.textContent = "Error: no se encontró el target AR.";
    }
    throw new Error("Target AR no encontrado.");
  }

  // ================================
  // CONFIGURACIÓN DEL VÍDEO
  // ================================
  videoElement.muted = true;
  videoElement.loop = true;
  videoElement.playsInline = true;
  videoElement.setAttribute("playsinline", "");
  videoElement.setAttribute("webkit-playsinline", "");

  // ================================
  // FUNCIÓN PARA REPRODUCIR
  // ================================
  async function reproducirVideo() {
    try {
      await videoElement.play();

      if (messageElement) {
        messageElement.textContent = "¡Vídeo reproduciéndose!";
      }

      console.log("Vídeo reproduciéndose correctamente.");

    } catch (error) {
      console.error("Error al reproducir el vídeo:", error);

      if (messageElement) {
        if (error.name === "NotAllowedError") {
          messageElement.innerHTML =
            "Toca la pantalla para reproducir el vídeo.";
        } else {
          messageElement.textContent =
            "No se pudo reproducir el vídeo.";
        }
      }
    }
  }

  // ================================
  // ERROR DEL VÍDEO
  // ================================
  videoElement.addEventListener("error", function () {
    let mensaje = "Error desconocido del vídeo.";

    if (videoElement.error) {
      switch (videoElement.error.code) {
        case MediaError.MEDIA_ERR_ABORTED:
          mensaje = "La reproducción del vídeo fue cancelada.";
          break;

        case MediaError.MEDIA_ERR_NETWORK:
          mensaje = "Error de red al cargar el vídeo.";
          break;

        case MediaError.MEDIA_ERR_DECODE:
          mensaje = "Error al decodificar el vídeo.";
          break;

        case MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED:
          mensaje = "Formato de vídeo no compatible.";
          break;

        default:
          mensaje =
            `Error del vídeo (código ${videoElement.error.code}).`;
      }
    }

    console.error("Error del vídeo:", videoElement.error);

    if (messageElement) {
      messageElement.textContent = mensaje;
    }
  });

  // ================================
  // VÍDEO LISTO
  // ================================
  videoElement.addEventListener("canplay", function () {
    console.log("Vídeo listo para reproducirse.");
  });

  // ================================
  // TARGET ENCONTRADO
  // ================================
  arTargetElement.addEventListener("targetFound", function () {
    console.log("Target AR encontrado.");

    if (messageElement) {
      messageElement.textContent = "¡Patrón reconocido!";
    }

    reproducirVideo();
  });

  // ================================
  // TARGET PERDIDO
  // ================================
  arTargetElement.addEventListener("targetLost", function () {
    console.log("Target AR perdido.");

    videoElement.pause();

    // Reinicia el vídeo para la próxima detección.
    videoElement.currentTime = 0;

    if (messageElement) {
      messageElement.textContent =
        "Apunta la cámara hacia el patrón.";
    }
  });

  // ================================
  // PERMITIR REPRODUCCIÓN MEDIANTE TOQUE
  // ================================
  document.addEventListener(
    "click",
    function () {
      if (videoElement.paused) {
        reproducirVideo();
      }
    },
    { once: true }
  );

  document.addEventListener(
    "touchstart",
    function () {
      if (videoElement.paused) {
        reproducirVideo();
      }
    },
    { once: true }
  );

  console.log("Sistema AR + vídeo inicializado correctamente.");
</script>
