<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>AR Vídeo</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }

  /* Botón para activar el sonido (los navegadores bloquean autoplay con audio) */
  #unmute-btn {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 999;
    padding: 12px 20px;
    background: rgba(0,0,0,0.7);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    display: none;
  }

  #loading {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: black;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
    z-index: 1000;
  }
</style>
</head>
<body>

<div id="loading">Cargando AR...</div>
<button id="unmute-btn">🔊 Activar sonido</button>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: yes; uiLoading: no;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: true"
>

  <a-assets>
    <video
      id="ar-video"
      src="./video.MP4"
      preload="auto"
      loop
      playsinline
      webkit-playsinline
      crossorigin="anonymous"
      muted
    ></video>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">
    <a-video
      src="#ar-video"
      width="1"
      height="0.5625"
      position="0 0 0"
      rotation="0 0 0"
    ></a-video>
  </a-entity>

</a-scene>

<script>
  const sceneEl = document.querySelector('a-scene');
  const video = document.getElementById('ar-video');
  const loading = document.getElementById('loading');
  const unmuteBtn = document.getElementById('unmute-btn');

  sceneEl.addEventListener('loaded', () => {
    loading.style.display = 'none';
  });

  const target = document.querySelector('[mindar-image-target]');

  // Cuando se detecta la imagen: reproducir el vídeo desde el inicio
  target.addEventListener('targetFound', () => {
    video.currentTime = 0;
    video.play().catch(err => {
      console.warn('No se pudo reproducir automáticamente:', err);
    });
    unmuteBtn.style.display = 'block';
  });

  // Cuando se pierde la imagen: pausar (el loop sigue activo mientras se ve)
  target.addEventListener('targetLost', () => {
    video.pause();
  });

  // Botón para activar sonido (por restricciones de autoplay del navegador)
  unmuteBtn.addEventListener('click', () => {
    video.muted = false;
    video.play();
    unmuteBtn.style.display = 'none';
  });
</script>

</body>
</html>
