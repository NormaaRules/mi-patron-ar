<script>
  // ============================================
  // ELEMENTOS DEL DOM
  // ============================================

  const videoElement = document.querySelector("#video");
  const messageElement = document.querySelector("#mensaje");

  const arTargetElement = document.querySelector(
    '[mindar-image-target="targetIndex: 0"]'
  );


  // ============================================
  // COMPROBACIONES
  // ============================================

  if (!videoElement) {
    console.error("Error: no se encontró #video.");

    if (messageElement) {
      messageElement.textContent =
        "Error: no se encontró el elemento de vídeo.";
    }

    // No detenemos MindAR.
  }

  if (!arTargetElement) {
    console.error(
      'Error: no se encontró [mindar-image-target="targetIndex: 0"].'
    );

    if (messageElement) {
      messageElement.textContent =
        "Error: no se encontró el target de AR.";
    }

    // No detenemos MindAR.
  }


  // ============================================
  // CONFIGURACIÓN DEL VÍDEO
  // ============================================

  if (videoElement) {
    videoElement.muted = true;
    videoElement.loop = true;
    videoElement.playsInline = true;

    videoElement.setAttribute("muted", "");
    videoElement.setAttribute("playsinline", "");
    videoElement.setAttribute("webkit-playsinline", "");
  }


  // ============================================
  // ERROR DEL VÍDEO
  // ============================================

  if (videoElement) {
    videoElement.addEventListener("error", function () {

      let errorMessage = "Error desconocido del vídeo.";

      if (videoElement.error) {

        switch (videoElement.error.code) {

          case MediaError.MEDIA_ERR_ABORTED:
            errorMessage =
              "Reproducción del vídeo abortada.";
            break;

          case MediaError.MEDIA_ERR_NETWORK:
            errorMessage =
              "Error de red al cargar el vídeo.";
            break;

          case MediaError.MEDIA_ERR_DECODE:
            errorMessage =
              "Error al decodificar el vídeo.";
            break;

          case MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED:
            errorMessage =
              "Formato de vídeo no compatible.";
            break;

          default:
            errorMessage =
              `Error del vídeo (código: ${videoElement.error.code}).`;
        }

        console.error(
          "Error del vídeo:",
          videoElement.error
        );

      } else {
        console.error(
          "Error del vídeo: código desconocido."
        );
      }

      if (messageElement) {
        messageElement.textContent =
          "ERROR DEL VÍDEO: " + errorMessage;
      }
    });
  }


  // ============================================
  // VÍDEO LISTO
  // ============================================

  if (videoElement) {
    videoElement.addEventListener("canplay", function () {
      console.log("El vídeo está listo para reproducirse.");
    });
  }


  // ============================================
  // FUNCIÓN PARA REPRODUCIR EL VÍDEO
  // ============================================

  async function reproducirVideo() {

    if (!videoElement) {
      return;
    }

    try {

      await videoElement.play();

      console.log(
        "Vídeo reproduciéndose correctamente."
      );

      if (messageElement) {
        messageElement.textContent =
          "¡Vídeo reproduciéndose!";
      }

    } catch (error) {

      console.error(
        "ERROR AL REPRODUCIR EL VÍDEO:",
        error
      );

      if (messageElement) {

        if (error.name === "NotAllowedError") {

          messageElement.textContent =
            "Toca la pantalla para reproducir el vídeo.";

        } else {

          messageElement.textContent =
            "Error al reproducir el vídeo.";
        }
      }
    }
  }


  // ============================================
  // TARGET ENCONTRADO
  // ============================================

  if (arTargetElement) {

    arTargetElement.addEventListener(
      "targetFound",
      function () {

        console.log("TARGET AR ENCONTRADO.");

        if (messageElement) {
          messageElement.textContent =
            "¡Patrón reconocido! Preparando vídeo...";
        }

        reproducirVideo();
      }
    );


    // ============================================
    // TARGET PERDIDO
    // ============================================

    arTargetElement.addEventListener(
      "targetLost",
      function () {

        console.log("TARGET AR PERDIDO.");

        if (videoElement) {

          videoElement.pause();

          // Volver al principio para la próxima detección.
          videoElement.currentTime = 0;
        }

        if (messageElement) {
          messageElement.textContent =
            "Apunta la cámara hacia el patrón.";
        }
      }
    );
  }


  // ============================================
  // PERMITIR REPRODUCCIÓN CON TOQUE
  // ============================================

  function permitirReproduccion() {

    if (!videoElement) {
      return;
    }

    if (videoElement.paused) {
      reproducirVideo();
    }
  }

  document.addEventListener(
    "click",
    permitirReproduccion,
    { once: true }
  );

  document.addEventListener(
    "touchstart",
    permitirReproduccion,
    { once: true }
  );


  // ============================================
  // FIN
  // ============================================

  console.log(
    "Script de control AR + vídeo cargado correctamente."
  );

</script>
